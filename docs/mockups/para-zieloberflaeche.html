function taskForm(task=null,d=currentDestination()){const current=task||{title:'',context:'',group:state.nav==='Aufgaben'&&filters.slice(1,5).includes(state.filter)?state.filter:'Nächste Aktionen',date:'',parent:d.parent,nav:d.nav};const choices=choicesFor(null);const selected=choices.findIndex(x=>x.parent===(current.parent||null)&&x.nav===current.nav);showDialog(task?'Aufgabe bearbeiten':'Neue Aufgabe','<label>Aufgabe<input name="title" value="'+esc(current.title)+'"></label><label>Status<select name="group">'+filters.slice(1,5).map(s=>'<option '+(s===current.group?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label>Ablage<select name="destination">'+choices.map((x,i)=>'<option value="'+i+'" '+(i===Math.max(0,selected)?'selected':'')+'>'+esc(destinationName(x))+'</option>').join('')+'</select></label><label>Kontext<input name="context" value="'+esc(current.context)+'"></label><label>Termin (optional)<input name="date" value="'+esc(current.date)+'" placeholder="z. B. 28. Okt."></label>',[cancelAction(),{label:'Speichern',primary:true,run:()=>{const title=field('title').value.trim();if(!title){error('Bitte einen Aufgabentitel eingeben.');return;}const loc=choices[Number(field('destination').value)],t=task||{id:uid()};Object.assign(t,{title,context:field('context').value.trim(),group:field('group').value,date:field('date').value.trim(),parent:loc.parent,nav:loc.nav});if(!task)tasks.push(t);syncTasks();closeDialog();if(state.nav!=='Aufgaben'){if(t.project){state.project=t.project;state.nav='Projekte';state.mode='tasks';}else{state.nav='Aufgaben';state.filter=t.group;}}else if(!task)state.filter=t.group;render();save();}}]);}
function markTask(t,outcome){if(outcome)terminal[t.id]=outcome;else delete terminal[t.id];state.done=tasks.filter(t=>terminal[t.id]==='done').map(t=>t.id);render();save();notice(outcome==='cancelled'?'Als nicht mehr relevant markiert':outcome==='done'?'Als erledigt markiert':'Aufgabe wieder aufgenommen');}
function taskMenu(t,anchor){if(t.nav==='Archiv'){openMenu(t.title,[{label:'Wiederherstellen …',icon:'rotate-ccw',run:()=>moveForm(null,t)}],anchor);return;}const end=terminal[t.id];const items=[{label:'Bearbeiten …',icon:'pencil',run:()=>taskForm(t)},{label:'Verschieben …',icon:'folder-input',run:()=>moveForm(null,t)}];if(end)items.push({label:'Wieder aufnehmen',icon:'rotate-ccw',run:()=>markTask(t,null)});else items.push({label:'Erledigt',icon:'circle-check',run:()=>markTask(t,'done')},{label:'Nicht mehr relevant',icon:'circle-slash',run:()=>markTask(t,'cancelled')});if(!end&&t.group==='Irgendwann / Vielleicht')items.push({label:'In Projekt umwandeln …',icon:'flag',run:()=>guard(()=>projectForm(t))});openMenu(t.title,items,anchor);}
function archiveProject(n){guard(()=>{showDialog('Projekt abschließen','<p>„'+esc(n.name)+'“ mit seinen Inhalten ins Archiv verschieben?</p>',[cancelAction(),{label:'Abschließen',primary:true,run:()=>{const origin=byId['archive-projects'];setLocation(n,{parent:origin.id,nav:'Archiv'});projects[n.id].archived=true;syncTasks();closeDialog();selectFile(projects[n.id].doc);render();save();}}]);});}
function entryMenu(n,anchor){const items=[];if(!isArchived(n)){if(n.kind!=='file'){const d=destinationOf(n);items.push({label:'Neue Notiz …',icon:'file-pen',run:()=>guard(()=>createForm('md',d))},{label:'Neuer Ordner …',icon:'folder-plus',run:()=>createForm('folder',d)},{label:'Dateien hinzufügen …',icon:'file-plus',run:()=>pickFiles(d,false)},{label:'Ordner hinzufügen …',icon:'folder-input',run:()=>pickFiles(d,true)});}else if(editable(n))items.push({label:'Bearbeiten',icon:'pencil',run:()=>guard(()=>{selectFile(n.id);editor={id:n.id,editing:true,draft:n.text,dirty:false};render();root.querySelector('[data-source-editor]')?.focus();})});items.push({label:n.kind==='project'?'Projektdetails …':'Umbenennen …',icon:'pencil',run:()=>renameForm(n)});if(['file','folder'].includes(n.kind))items.push({label:'Verschieben …',icon:'folder-input',run:()=>moveForm(n)});if(n.kind==='project')items.push({label:'Projekt abschließen …',icon:'archive',run:()=>archiveProject(n)});}items.push({label:'Link anzeigen',icon:'link',run:()=>showDialog('Stabiler Link','<label>Link<input readonly value="para://item/'+esc(n.id)+'"></label>',[{label:'Schließen',run:closeDialog}])});openMenu(n.name,items,anchor);}
const filePicker=document.createElement('input');filePicker.type='file';filePicker.multiple=true;filePicker.hidden=true;app.appendChild(filePicker);
const folderPicker=document.createElement('input');folderPicker.type='file';folderPicker.multiple=true;folderPicker.setAttribute('webkitdirectory','');folderPicker.hidden=true;app.appendChild(folderPicker);
function pickFiles(d,folder){closeMenu();importTarget=d;(folder?folderPicker:filePicker).click();}
function byteSize(size){return size<1024?size+' B':(size/1024).toFixed(1).replace('.',',')+' KB';}
async function importFile(file,d){let preview=null,text='';const ext=file.name.split('.').pop().toLowerCase(),isText=['md','markdown','txt','csv'].includes(ext);if(isText&&file.size<=1024*1024){try{text=new TextDecoder('utf-8',{fatal:true}).decode(await file.arrayBuffer());preview=ext==='csv'?'csv':'md';}catch{preview=null;}}else if(file.type.startsWith('image/')||['png','jpg','jpeg','gif','webp','svg'].includes(ext))preview='image';const url=URL.createObjectURL(file);temporaryURLs.push(url);const n={id:uid(),kind:'file',name:nextName(file.name,d),type:file.type||ext.toUpperCase()+'-Datei',size:byteSize(file.size),preview,text,imported:true,objectURL:url,file};setLocation(n,d);addNode(n);return n;}
async function importFileList(files,d){if(!files.length)return;let latest=null;const folders=new Map();for(const f of files){let at=d;const parts=(f.webkitRelativePath||f.name).split('/');for(const part of parts.slice(0,-1)){const key=(at.parent||at.nav)+'/'+part;if(!folders.has(key)){const n={id:uid(),kind:'folder',name:nextName(part,at)};setLocation(n,at);addNode(n);folders.set(key,n);}at=destinationOf(folders.get(key));}latest=await importFile(f,at);}if(latest)selectFile(latest.id);render();save();notice(files.length+' Datei'+(files.length===1?'':'en')+' hinzugefügt · '+destinationName(d));}
filePicker.onchange=()=>{const files=[...filePicker.files];const d=importTarget;filePicker.value='';guard(()=>{importFileList(files,d).catch(()=>notice('Import konnte nicht abgeschlossen werden.'));});};
folderPicker.onchange=()=>{const files=[...folderPicker.files];const d=importTarget;folderPicker.value='';guard(()=>{importFileList(files,d).catch(()=>notice('Ordnerimport konnte nicht abgeschlossen werden.'));});};
async function importEntry(entry,d){if(entry.isFile){const file=await new Promise((resolve,reject)=>entry.file(resolve,reject));return importFile(file,d);}if(entry.isDirectory){const n={id:uid(),kind:'folder',name:nextName(entry.name,d)};setLocation(n,d);addNode(n);const reader=entry.createReader();let latest=null;while(true){const batch=await new Promise((resolve,reject)=>reader.readEntries(resolve,reject));if(!batch.length)break;for(const child of batch)latest=await importEntry(child,d)||latest;}return latest;}}
function dropDestination(target){const row=target.closest('[data-node-row]');if(row){const n=byId[row.dataset.nodeRow];if(n.kind==='file')return null;return destinationOf(n);}const nav=target.closest('[data-nav]');if(nav)return ['Inbox','Bereiche','Ressourcen'].includes(nav.dataset.nav)?{parent:null,nav:nav.dataset.nav}:null;if(target.closest('.explorer,.main')&&state.nav!=='Aufgaben'&&state.nav!=='Archiv')return currentDestination();return null;}
root.addEventListener('dragstart',e=>{const row=e.target.closest('[data-node-row][draggable="true"]');if(!row)return;dragId=row.dataset.nodeRow;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-para-entry',dragId);e.dataTransfer.setData('text/plain',byId[dragId].name);row.classList.add('dragging');});
function clearDrop(){root.querySelectorAll('.drop-hover,.dragging').forEach(e=>e.classList.remove('drop-hover','dragging'));}
root.addEventListener('dragend',()=>{dragId=null;clearDrop();});
root.addEventListener('dragover',e=>{const d=dropDestination(e.target);if(!d){e.preventDefault();e.dataTransfer.dropEffect='none';return;}const id=dragId||e.dataTransfer.getData('application/x-para-entry');if(id&&!canMove(byId[id],d)){e.dataTransfer.dropEffect='none';return;}e.preventDefault();e.dataTransfer.dropEffect=id?'move':'copy';root.querySelectorAll('.drop-hover').forEach(e=>e.classList.remove('drop-hover'));const hit=e.target.closest('[data-node-row],[data-nav]')||root.querySelector('.explorer');hit.classList.add('drop-hover');root.querySelector('[data-status]').textContent=(id?'Verschieben nach: ':'Dateien hinzufügen zu: ')+destinationName(d);});
root.addEventListener('dragleave',e=>{if(!root.contains(e.relatedTarget))clearDrop();});
root.addEventListener('drop',e=>{const d=dropDestination(e.target);if(!d){e.preventDefault();notice('Bitte auf einen aktiven Ordner, ein Projekt oder eine aktive Ablage ziehen.');return;}e.preventDefault();e.stopPropagation();const id=dragId||e.dataTransfer.getData('application/x-para-entry');dragId=null;clearDrop();if(id){moveNode(byId[id],d);return;}const entries=[...e.dataTransfer.items].map(i=>i.webkitGetAsEntry?.()).filter(Boolean),files=[...e.dataTransfer.files];guard(async()=>{try{if(entries.some(x=>x.isDirectory)){let last=null;for(const entry of entries)last=await importEntry(entry,d)||last;if(last)selectFile(last.id);render();save();notice('Ordner und Dateien hinzugefügt · '+destinationName(d));}else await importFileList(files,d);}catch{notice('Import konnte nicht vollständig abgeschlossen werden.');render();}});});
root.addEventListener('contextmenu',e=>{const row=e.target.closest('[data-node-row]'),task=e.target.closest('[data-task-row]');if(row){e.preventDefault();entryMenu(byId[row.dataset.nodeRow],{x:e.clientX,y:e.clientY});}else if(task){e.preventDefault();taskMenu(taskById(task.dataset.taskRow),{x:e.clientX,y:e.clientY});}else if(e.target.closest('.explorer')){e.preventDefault();newMenu({x:e.clientX,y:e.clientY});}});
function navigation(b){if(b.dataset.node){const n=byId[b.dataset.node];if(n.kind==='folder'){toggle(n.id);selectedContainer=n.id;}else if(n.kind==='project'){toggle(n.id);state.project=n.id;selectFile(projects[n.id].doc);}else selectFile(n.id);}else if(b.dataset.nav){state.nav=b.dataset.nav;selectedContainer=null;state.info=false;if(state.nav!=='Aufgaben'){let first=state.nav==='Projekte'?(projects[state.project]&&!projects[state.project].archived?byId[projects[state.project].doc]:byId.overview):nodes.find(n=>n.kind==='file'&&navFor(n)===state.nav);if(first)selectFile(first.id);}}else if(b.dataset.mode){state.mode=b.dataset.mode;state.info=false;}else if(b.dataset.filter)state.filter=b.dataset.filter;render();save();}
root.addEventListener('click',e=>{if(performance.now()<suppressClickUntil){suppressClickUntil=0;e.preventDefault();e.stopImmediatePropagation();return;}const b=e.target.closest('button');if(!b)return;
 if(b.dataset.menuAction!==undefined){e.preventDefault();e.stopImmediatePropagation();const action=contextActions[Number(b.dataset.menuAction)];closeMenu();action?.run();return;}
 if(b.dataset.dialogAction!==undefined){e.preventDefault();e.stopImmediatePropagation();modalActions[b.dataset.dialogAction]?.();return;}
 if(b.dataset.entryMenu){e.stopImmediatePropagation();entryMenu(byId[b.dataset.entryMenu],b);return;}
 if(b.dataset.taskMenu){e.stopImmediatePropagation();taskMenu(taskById(b.dataset.taskMenu),b);return;}
 if(b.dataset.editTask){e.stopImmediatePropagation();const t=taskById(b.dataset.editTask);if(t.nav==='Archiv')notice('Archivierte Aufgabe: Zum Bearbeiten zuerst wiederherstellen.');else taskForm(t);return;}
 const action=b.dataset.action;
 if(['add','edit-file','save-file','new-task','app-menu'].includes(action)){e.preventDefault();e.stopImmediatePropagation();if(action==='add')newMenu(b);else if(action==='save-file')saveCurrent();else if(action==='edit-file'){editor.editing=!editor.editing;render();if(editor.editing)root.querySelector('[data-source-editor]')?.focus();}else if(action==='new-task')guard(()=>taskForm());else showDialog('Menü','<div class="menu-placeholder">Weitere Menüpunkte sind noch nicht festgelegt.</div>',[{label:'Schließen',primary:true,run:closeDialog}]);return;}
 if(b.dataset.node||b.dataset.nav||b.dataset.mode||b.dataset.filter){e.stopImmediatePropagation();const data={...b.dataset};const fake={dataset:data};if(b.dataset.node&&byId[b.dataset.node].kind==='folder'||b.dataset.node===state.doc)navigation(fake);else guard(()=>navigation(fake));}
},true);
root.addEventListener('input',e=>{if(e.target.matches('[data-source-editor]')){editor.draft=e.target.value;editor.dirty=editor.draft!==byId[editor.id].text;const btn=root.querySelector('[data-action="save-file"]');if(btn)btn.disabled=!editor.dirty;const label=root.querySelector('[data-dirty-label]');if(label)label.hidden=!editor.dirty;}});
root.addEventListener('change',e=>{if(e.target.dataset.task){e.stopImmediatePropagation();const t=taskById(e.target.dataset.task);markTask(t,e.target.checked?'done':null);}},true);
root.addEventListener('pointerdown',e=>{if(!context.hidden&&!context.contains(e.target)&&!e.target.closest('[data-entry-menu],[data-task-menu],[data-action="add"]'))closeMenu();});
document.addEventListener('keydown',e=>{
 if(!uiLayer.hidden){if(e.key==='Escape'){e.preventDefault();closeDialog();}else if(e.key==='Tab'){const controls=[...uiLayer.querySelectorAll('input,select,textarea,button')],first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(!context.hidden){if(e.key==='Escape'){e.preventDefault();closeMenu();}if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const items=[...context.querySelectorAll('button')],i=items.indexOf(document.activeElement);items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus();}return;}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveCurrent();}else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();guard(()=>createForm('md',currentDestination()));}else if(e.shiftKey&&e.key==='F10'){const row=e.target.closest('[data-node-row]'),task=e.target.closest('[data-task-row]');if(row){e.preventDefault();entryMenu(byId[row.dataset.nodeRow],row);}else if(task){e.preventDefault();taskMenu(taskById(task.dataset.taskRow),task);}}
});
window.addEventListener('beforeunload',e=>{if(editor.dirty){e.preventDefault();e.returnValue='';}});
window.addEventListener('unload',()=>{for(const url of temporaryURLs)URL.revokeObjectURL(url);});
const remembered=window.openai?.widgetState?.privateContent;if(remembered?.version===3){if(typeof remembered.expanded==='boolean')state.expanded=remembered.expanded;if(['Inbox','Projekte','Bereiche','Ressourcen','Archiv','Aufgaben'].includes(remembered.nav))state.nav=remembered.nav;if(projects[remembered.project])state.project=remembered.project;if(filters.includes(remembered.filter))state.filter=remembered.filter;if(['contents','tasks'].includes(remembered.mode))state.mode=remembered.mode;}
render();

// Internal dragging uses pointer events so it also works in the embedded preview.
let pointerDrag=null;
const dragBadge=document.createElement('div');dragBadge.className='notice';dragBadge.style.cssText='position:absolute;left:0;right:auto;bottom:auto;max-width:220px;pointer-events:none;z-index:80;padding:6px 10px';dragBadge.hidden=true;app.appendChild(dragBadge);
function finishPointerDrag(){pointerDrag=null;dragBadge.hidden=true;app.classList.remove('internal-drag');clearDrop();}
root.addEventListener('pointerdown',e=>{suppressClickUntil=0;if(e.button!==0||e.pointerType==='touch'||e.target.closest('[data-entry-menu]'))return;const row=e.target.closest('[data-node-row]'),n=row&&byId[row.dataset.nodeRow];if(n&&['file','folder'].includes(n.kind)&&!isArchived(n))pointerDrag={id:n.id,x:e.clientX,y:e.clientY,active:false};});
document.addEventListener('pointermove',e=>{if(!pointerDrag)return;const p=pointerDrag;if(!p.active&&Math.hypot(e.clientX-p.x,e.clientY-p.y)<6)return;p.active=true;e.preventDefault();app.classList.add('internal-drag');const n=byId[p.id],r=root.getBoundingClientRect(),target=document.elementFromPoint(e.clientX,e.clientY),d=target?dropDestination(target):null;root.querySelectorAll('.drop-hover,.dragging').forEach(x=>x.classList.remove('drop-hover','dragging'));root.querySelector('[data-node-row="'+p.id+'"]')?.classList.add('dragging');dragBadge.textContent=n.name;dragBadge.hidden=false;dragBadge.style.left=Math.max(6,Math.min(r.width-180,e.clientX-r.left+13))+'px';dragBadge.style.top=Math.max(6,e.clientY-r.top+14)+'px';if(d&&canMove(n,d)){(target.closest('[data-node-row],[data-nav]')||root.querySelector('.explorer')).classList.add('drop-hover');root.querySelector('[data-status]').textContent='Verschieben nach: '+destinationName(d);}else root.querySelector('[data-status]').textContent='Hier kann dieser Inhalt nicht abgelegt werden.';});
document.addEventListener('pointerup',e=>{if(!pointerDrag)return;const p=pointerDrag;if(!p.active){finishPointerDrag();return;}suppressClickUntil=performance.now()+400;const target=document.elementFromPoint(e.clientX,e.clientY),d=target?dropDestination(target):null;finishPointerDrag();if(d&&canMove(byId[p.id],d))moveNode(byId[p.id],d);else{render();notice('Nicht verschoben: Bitte einen gültigen Ordner oder Ablageort wählen.');}});
document.addEventListener('pointercancel',finishPointerDrag);window.addEventListener('blur',finishPointerDrag);

})();

</script>
