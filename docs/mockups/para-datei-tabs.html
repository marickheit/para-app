<style>
:root{color-scheme:light;--bg:#f4f5f1;--paper:#fcfcfa;--rail:#e9ece5;--side:#f0f2ec;--line:#dce1d6;--ink:#29372e;--muted:#728071;--accent:#315e42;--selected:#dce8d9}*{box-sizing:border-box}body{margin:0;background:#e5e8e0;color:var(--ink);font:13px/1.5 system-ui,sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;border-radius:5px;padding:6px 10px}button:hover{background:var(--selected)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button[aria-pressed=true]{background:var(--selected);color:var(--accent)}[hidden]{display:none!important}.review{padding:19px 28px 17px;display:flex;align-items:center;gap:24px;background:#f7f8f3;border-bottom:1px solid #ced5c8}.brand{font-size:11px;letter-spacing:2px;font-weight:750}.review h1{font-size:19px;margin:3px 0 0;font-weight:550}.variants{display:flex;gap:5px;margin-left:auto;padding:4px;background:#e9ede3;border-radius:8px}.variants button{padding:8px 13px;white-space:nowrap}.variants button[aria-pressed=true]{background:var(--paper);box-shadow:0 1px 4px #29372e15}.explanation{display:flex;gap:20px;align-items:center;padding:11px 28px;background:#f7f8f3;color:var(--muted);font-size:12px}.explanation strong{color:var(--accent);font-weight:600}.explanation span:last-child{margin-left:auto;white-space:nowrap}.app{margin:0 20px 16px;border:1px solid #cbd3c4;border-radius:9px;overflow:hidden;display:grid;grid-template-columns:52px 228px minmax(0,1fr);height:calc(100dvh - 167px);min-height:530px;background:var(--paper);box-shadow:0 10px 30px #29372e09}.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:12px 5px;gap:9px}.rail button{width:38px;height:37px;padding:7px;font-size:19px}.rail .bottom{margin-top:auto}.explorer{background:var(--side);border-right:1px solid var(--line);overflow:auto;padding:13px 10px}.explorer header{display:flex;align-items:center;justify-content:space-between;padding:0 7px 16px;font-weight:650}.tree{display:flex;flex-direction:column;gap:3px}.tree button{width:100%;text-align:left;font-size:12px;padding:7px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree .nested{padding-left:28px}.tree .project{background:#e2e6dc;font-weight:550}.tree small{padding:24px 9px 7px;color:var(--muted);font-size:10px;letter-spacing:1px}.local{color:var(--muted);font-size:11px;padding:28px 8px}.local i{display:inline-block;border-radius:50%;background:#73986b;width:6px;height:6px;margin-right:6px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.tabs{height:42px;display:flex;align-items:stretch;background:#edf0e8;border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto}.tab{display:flex;align-items:center;min-width:150px;max-width:240px;border-right:1px solid var(--line);position:relative}.tab.active{background:var(--paper)}.tab.active:before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:#60815a}.tab.preview .tab-label{font-style:italic}.tab-label{border-radius:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;padding:10px 14px;text-align:left}.close{padding:4px 7px;margin-right:5px;font-size:15px;color:var(--muted)}.nav-toggle{border-right:1px solid var(--line);border-radius:0;min-width:40px}.toolbar{display:flex;align-items:center;gap:5px;padding:7px 16px;min-height:44px;border-bottom:1px solid var(--line);flex-wrap:wrap;flex-shrink:0}.crumb{font-size:11px;color:var(--muted);margin-right:auto}.tools{display:flex;gap:3px;align-items:center}.tools button{font-size:11px;white-space:nowrap}.tools .icon{font-size:17px;padding:2px 8px}.workspace{display:flex;flex:1;min-height:0;min-width:0}.pane{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}.pane+.pane{border-left:3px solid #c6d1bd}.pane-title{padding:9px 22px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.scroll{overflow:auto;flex:1;min-height:0}.document{padding:25px 34px 55px;font-size:15px;line-height:1.8}.document.readable{max-width:760px;margin:0 auto;width:100%}.eyebrow{font:10px/1.5 system-ui;letter-spacing:1.8px;color:var(--muted);margin-bottom:7px}.document h1{font-size:30px;line-height:1.3;font-weight:550;letter-spacing:-.7px;margin:0 0 15px}.document h2{font-size:18px;font-weight:600;margin:26px 0 8px}.document p{margin:8px 0 14px}.document ul{padding-left:22px}.document li{padding:3px 0}.document a{color:var(--accent);text-underline-offset:3px}.callout{border-left:3px solid #90aa7e;background:#f0f4eb;padding:13px 18px;margin:20px 0;color:#49603d}.document table{border-collapse:collapse;width:100%;font-size:13px;margin:14px 0}.document th,.document td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}.document th{background:#f0f3eb;font-weight:550}.document blockquote{margin:18px 0;border-left:2px solid #a7b59c;padding-left:18px;color:var(--muted)}.status{height:26px;border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 15px;font-size:10px;color:var(--muted);flex-shrink:0}.status span:last-child{margin-left:auto}.pdf-surface{background:#e3e7de;padding:22px 28px;min-height:100%;overflow:hidden}.pdf-page{background:white;max-width:1000px;min-height:900px;margin:0 auto;padding:6% 8%;box-shadow:0 2px 10px #29372e14;color:#303b34}.pdf-page h1{font:500 34px/1.2 Georgia,serif;max-width:450px;margin:35px 0 22px}.pdf-page p{font-size:13px;line-height:1.9}.pdf-tag{color:#68835d;font-size:10px;letter-spacing:2px}.pdf-rule{height:2px;background:#91a481;margin:25px 0}.pdf-page h2{font-size:17px;font-weight:550;margin-top:30px}.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0}.pdf-card{background:#f1f4ed;padding:20px}.pdf-card b{display:block;font:32px Georgia,serif;color:#637f55}.pdf-chart{display:flex;gap:12px;height:125px;align-items:flex-end;padding:10px 0;border-bottom:1px solid #aaa}.pdf-chart i{flex:1;background:#b7c6a6}.photo-surface{background:#e3e7de;height:100%;display:flex;align-items:center;justify-content:center;padding:22px}.photo-surface svg{width:100%;max-height:100%;box-shadow:0 3px 12px #29372e20}.csv{width:100%;border-collapse:collapse;font:12px/1.6 ui-monospace,monospace}.csv td,.csv th{border:1px solid var(--line);padding:12px 20px;text-align:left;white-space:nowrap}.csv th{background:#eef2e9;position:sticky;top:0}.source{display:block;width:100%;height:100%;resize:none;border:0;background:var(--paper);padding:28px 34px;font:14px/1.9 ui-monospace,monospace;outline-offset:-3px}.app.focus{grid-template-columns:52px minmax(0,1fr)}.app.focus .explorer{display:none}.split .document{padding:25px 26px}.split .document h1{font-size:25px}.split .pdf-surface{padding:20px}.split .pdf-page{padding:35px;min-height:850px}.split .pdf-page h1{font-size:28px}.notice{position:fixed;bottom:45px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#2e4735;color:white;border-radius:7px;box-shadow:0 4px 15px #0002;z-index:9}.overlay{position:fixed;inset:0;background:#23332440;display:grid;place-items:center;z-index:10}.dialog{width:min(480px,90vw);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 16px 70px #0002}.dialog h2{margin-top:0;font-size:19px}.dialog input{width:100%;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:5px}.results{display:flex;flex-direction:column;margin:12px 0}.results button{text-align:left;padding:10px}.dialog footer{display:flex;justify-content:flex-end;gap:6px;margin-top:20px}.primary{background:var(--selected)}@media(max-width:1050px){.review{gap:12px;padding:14px 20px}.review h1{font-size:16px}.variants button{padding:7px 9px;font-size:11px}.explanation{padding:10px 20px}.explanation span:last-child{display:none}.app{grid-template-columns:46px 195px minmax(0,1fr);margin:0 10px 10px}.tab{min-width:135px}.document{padding:24px}.tools{flex-wrap:wrap}}@media(max-width:720px){.review{align-items:flex-start;flex-direction:column;gap:10px}.variants{margin-left:0;width:100%}.variants button{flex:1}.app{grid-template-columns:42px minmax(0,1fr);height:calc(100dvh - 205px)}.explorer{display:none}.app.focus{grid-template-columns:42px minmax(0,1fr)}.app.mobile-explorer .explorer{display:block;position:absolute;left:53px;width:220px;top:205px;bottom:40px;z-index:5;box-shadow:8px 0 20px #0002}.crumb{width:100%}.split .workspace{flex-direction:column}.pane+.pane{border-left:0;border-top:3px solid #c6d1bd}.explanation{font-size:11px;min-height:54px}.document h1{font-size:25px}}

<header class="review"><div><div class="brand">P.A.R.A. / DESIGNSTUDIE 02</div><h1>Mehr Raum für deine Dateien.</h1></div><nav class="variants" aria-label="Layoutvarianten"><button data-variant="a" aria-pressed="true">A · Breite & Tabs</button><button data-variant="b" aria-pressed="false">B · Fokus</button><button data-variant="c" aria-pressed="false">C · Nebeneinander</button></nav></header>

<script>
const $=s=>document.querySelector(s);
const files={md:{name:'Gartenplanung.md',icon:'≡'},pdf:{name:'Pflanzkonzept.pdf',icon:'▤'},image:{name:'Gartenansicht.svg',icon:'▧'},csv:{name:'Kostenübersicht.csv',icon:'▦'}};
const descriptions={a:'<strong>A · Mein Favorit.</strong> Tabs oben, kompakter Dateikopf, Inhalt bis an die Fläche. Lesebreite bei Bedarf.',b:'<strong>B · In der Datei bleiben.</strong> Explorer eingeklappt, offene Dateien bleiben als Tabs erreichbar.',c:'<strong>C · Lesen und festhalten.</strong> PDF links, Markdown rechts. Zwei unabhängig scrollbare Flächen.'};
let variant='a',active='md',tabs=['md','pdf','image'],preview=null,readable=false,editing=false,dirty=false,noticeTimer,lastFocus;
let draft='# Garten neu gestalten\n\nEin ruhiger Garten, der zu unserem Alltag passt. Weniger Pflege, mehr Platz für gemeinsame Abende und Pflanzen, die auch im nächsten Sommer gut aussehen.\n\n## Was wir erreichen wollen\n\n- Eine zusammenhängende Sitzecke am Haus\n- Heimische Stauden statt der schmalen Rasenstreifen\n- Regenwasser dort nutzen, wo es anfällt\n\n## Nächste Schritte\n\n1. Pflanzkonzept mit der Gärtnerei besprechen.\n2. Angebote für den Terrassenbelag vergleichen.\n3. Pflanzliste und Kostenübersicht abgleichen.\n\n## Notizen zum Pflanzkonzept\n\nDie sonnige Seite braucht robuste Arten. Die höheren Gräser sollen den Sitzplatz leicht einfassen, ohne den Blick in den Garten zu schließen.\n';
let saved=draft;
const mdHTML=()=>`<div class="eyebrow">GARTEN / PLANUNG</div><h1>Garten neu gestalten</h1><p>Ein ruhiger Garten, der zu unserem Alltag passt. Weniger Pflege, mehr Platz für gemeinsame Abende und Pflanzen, die auch im nächsten Sommer gut aussehen.</p><div class="callout">Unser Ziel: ein fertiger Pflanz- und Terrassenplan für die Umsetzung im Frühjahr.</div><h2>Was wir erreichen wollen</h2><ul><li>Eine zusammenhängende Sitzecke am Haus</li><li>Heimische Stauden statt der schmalen Rasenstreifen</li><li>Regenwasser dort nutzen, wo es anfällt</li></ul><h2>Die Unterlagen im Überblick</h2><table><thead><tr><th>Unterlage</th><th>Wofür?</th><th>Stand</th></tr></thead><tbody><tr><td><a href="#pdf" data-link="pdf">Pflanzkonzept.pdf ↗</a></td><td>Aufteilung, Arten und Pflanzabstände</td><td>Besprechen</td></tr><tr><td><a href="#csv" data-link="csv">Kostenübersicht.csv ↗</a></td><td>Budget und Angebote</td><td>In Arbeit</td></tr></tbody></table><h2>Nächste Schritte</h2><ol><li>Pflanzkonzept mit der Gärtnerei besprechen.</li><li>Angebote für den Terrassenbelag vergleichen.</li><li>Pflanzliste und Kostenübersicht abgleichen.</li></ol><h2>Notizen zum Pflanzkonzept</h2><p>Die sonnige Seite braucht robuste Arten. Die höheren Gräser sollen den Sitzplatz leicht einfassen, ohne den Blick in den Garten zu schließen.</p><blockquote>Lieber wenige Arten in größeren Gruppen als viele einzelne Pflanzen.</blockquote>`;
const pdfHTML=()=>`<div class="pdf-surface"><article class="pdf-page"><div class="pdf-tag">GRÜNRAUM STUDIO &nbsp; / &nbsp; KONZEPT 01</div><h1>Ein Garten.<br>Viele Jahreszeiten.</h1><p>Pflanz- und Gestaltungskonzept<br>Entwurf für einen pflegeleichten Wohngarten</p><div class="pdf-rule"></div><h2>01 &nbsp; Die Idee</h2><p>Ein offener Sitzbereich am Haus geht in lockere Staudenflächen über. Gräser geben dem Garten Struktur und schaffen auch im Winter ein ruhiges Bild. Die vorhandenen Bäume bleiben die räumlichen Anker.</p><div class="pdf-grid"><div class="pdf-card"><b>24 m²</b>Neue Staudenfläche</div><div class="pdf-card"><b>12 Arten</b>Für Sonne und Halbschatten</div></div><h2>02 &nbsp; Blüte über die Saison</h2><div class="pdf-chart"><i style="height:25%"></i><i style="height:43%"></i><i style="height:67%"></i><i style="height:100%"></i><i style="height:90%"></i><i style="height:70%"></i><i style="height:48%"></i><i style="height:28%"></i></div><p style="font-size:10px;word-spacing:16px">MÄR APR MAI JUN JUL AUG SEP OKT</p><h2>03 &nbsp; Material und Atmosphäre</h2><p>Helle Natursteine, unbehandeltes Holz und ein zurückhaltendes Farbspektrum verbinden Terrasse und Garten. Versickerungsfähige Wege erhalten den natürlichen Wasserhaushalt.</p><div class="pdf-rule"></div><p style="font-size:10px">GRÜNRAUM STUDIO &nbsp; · &nbsp; BEISPIELDOKUMENT &nbsp; · &nbsp; 01</p></article></div>`;
const imageHTML=()=>`<div class="photo-surface"><svg viewBox="0 0 1000 670" role="img" aria-label="Synthetischer Gartenplan mit Terrasse, Staudenbeeten und Baumbestand" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="670" fill="#f0eee3"/><path d="M75 75H925V595H75Z" fill="#d5debd" stroke="#9ba88b" stroke-width="2"/><path d="M75 75H365V595H75Z" fill="#e4dbca"/><path d="M75 75H365V190H75Z" fill="#b9ada0"/><path d="M365 150Q600 70 850 145L880 260Q620 200 365 290Z" fill="#9cae7f"/><path d="M365 500Q650 410 885 470L900 595H365Z" fill="#a5b68c"/><path d="M365 360Q650 270 925 340" fill="none" stroke="#f0e9d6" stroke-width="46"/><g fill="#789465" stroke="#f0eee3" stroke-width="3"><circle cx="790" cy="160" r="65"/><circle cx="640" cy="540" r="65"/><circle cx="850" cy="515" r="43"/></g><g fill="#b4c19e"><circle cx="790" cy="160" r="42"/><circle cx="640" cy="540" r="43"/></g><rect x="140" y="300" width="150" height="90" rx="7" fill="#a48b68"/><g fill="#f4f0e7"><rect x="150" y="278" width="35" height="16"/><rect x="240" y="278" width="35" height="16"/><rect x="150" y="396" width="35" height="16"/><rect x="240" y="396" width="35" height="16"/></g><g font-family="system-ui" fill="#4a5a42" font-size="16"><text x="145" y="460">TERRASSE</text><text x="490" y="150">ST AUDEN / SONNE</text><text x="500" y="400">OFFENE GARTENMITTE</text><text x="90" y="640" font-size="12">GARTENANSICHT · SCHEMATISCHER ENTWURF</text><text x="885" y="55">N ↑</text></g></svg></div>`;
const csvHTML=()=>`<table class="csv"><thead><tr><th></th><th>Position</th><th>Menge</th><th>Einheit</th><th>Preis / Einheit</th><th>Gesamt</th><th>Lieferant</th></tr></thead><tbody>${[['Terrassenbelag','24','m²','68,00 €','1.632,00 €','Stein & Garten'],['Staudenmix Sonne','72','Stück','5,50 €','396,00 €','Gärtnerei Grün'],['Ziergräser','12','Stück','14,00 €','168,00 €','Gärtnerei Grün'],['Pflanzerde','3','m³','85,00 €','255,00 €','Regionalmarkt'],['Regentonne','1','Stück','189,00 €','189,00 €','Baumarkt'],['Holzbank','1','Stück','320,00 €','320,00 €','Tischlerei'],['Wegekies','2','t','110,00 €','220,00 €','Stein & Garten'],['Lieferung','1','Pauschal','120,00 €','120,00 €','Stein & Garten']].map((r,i)=>'<tr><td>'+(i+1)+'</td>'+r.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')}</tbody></table>`;
function notify(t){$('#notice').textContent=t;$('#notice').hidden=false;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>$('#notice').hidden=true,3400)}
function esc(t){return t.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function pane(id,label){let body=id==='md'?editing?`<textarea class="source" aria-label="Markdown-Quelltext">${esc(draft)}</textarea>`:`<article class="document ${readable?'readable':''}">${saved===initialDraft?mdHTML():'<div class="eyebrow">MARKDOWN / GESPEICHERTER DEMOTEXT</div><pre style="white-space:pre-wrap;font:inherit">'+esc(saved)+'</pre>'}</article>`:id==='pdf'?pdfHTML():id==='image'?imageHTML():csvHTML();return `<section class="pane" aria-label="${files[id].name}">${label?`<div class="pane-title"><span>${files[id].icon} &nbsp; ${files[id].name}</span><span>${id==='pdf'?'PDF · Seite 1 von 1':'Markdown · '+(editing?'Quelltext':'Vorschau')}</span></div>`:''}<div class="scroll">${body}</div></section>`}
const initialDraft=draft;
function render(){
 $('#idea').innerHTML=descriptions[variant];$('#app').classList.toggle('split',variant==='c');
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));
 $('#tabs').innerHTML=`<button class="nav-toggle" title="Explorer ein-/ausblenden" data-action="nav">◫</button>`+tabs.map(id=>`<div class="tab ${id===active?'active':''} ${preview===id?'preview':''}" data-tab="${id}"><button role="tab" aria-selected="${id===active}" class="tab-label" data-tab-select="${id}" title="${files[id].name}${preview===id?' · Vorschau, Doppelklick zum Behalten':''}">${files[id].icon} &nbsp; ${files[id].name}${id==='md'&&dirty?' ●':''}</button><button class="close" data-close="${id}" aria-label="${files[id].name} schließen">×</button></div>`).join('')+`<button title="Datei öffnen" data-action="search">＋</button>`;
 $('#crumb').textContent='Projekte / Garten neu gestalten'+(variant==='c'?'':' / '+files[active].name);
 const text=active==='md'||variant==='c';
 $('#tools').innerHTML=(text?`<button data-action="width" aria-pressed="${readable}">${readable?'↔ Volle Breite':'↔ Lesebreite'}</button><button data-action="edit">${editing?'Vorschau':'Bearbeiten'}</button>${editing?'<button class="primary" data-action="save">Speichern'+(dirty?' ●':'')+'</button>':''}<button class="icon" title="Textversionen" data-action="history">◷</button>`:active==='pdf'?'<button data-action="fit">↔ Seitenbreite</button><button data-action="external">Extern öffnen ↗</button>':active==='image'?'<button data-action="fit">⊡ Einpassen</button>':'<span style="font-size:11px;color:var(--muted)">Tabellenvorschau</span>')+'<button class="icon" title="Dateiinformationen" data-action="info">ⓘ</button><button class="icon" title="Dateiaktionen" data-action="more">⋯</button>';
 $('#workspace').innerHTML=variant==='c'?pane('pdf',true)+pane('md',true):pane(active,false);
 $('#file-status').textContent=variant==='c'?'Zwei Dateien · unabhängig scrollen':active==='md'?'Markdown · UTF-8':active==='pdf'?'PDF · Seite 1 von 1':active==='image'?'SVG · Ansicht eingepasst':'CSV · 8 Zeilen · Vorschau';
 $('#layout-status').textContent=variant==='c'?'Geteilte Ansicht':readable&&active==='md'?'Lesebreite · max. 760 px':'Volle Dateifläche';
 $('#save-status').textContent=dirty?'Ungespeicherter Demoentwurf':'Beispieldateien';
 document.querySelectorAll('[data-file]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.file===active));
 const source=$('.source');if(source)source.addEventListener('input',()=>{draft=source.value;dirty=draft!==saved;$('#save-status').textContent=dirty?'Ungespeicherter Demoentwurf':'Beispieldateien';const save=$('[data-action="save"]');if(save)save.textContent='Speichern'+(dirty?' ●':'');const tab=$('[data-tab-select="md"]');if(tab)tab.textContent='≡   Gartenplanung.md'+(dirty?' ●':'')});
}
function modal(title,body){lastFocus=document.activeElement;$('#dialog').innerHTML=`<h2 id="dialog-title">${title}</h2>${body}`;$('#overlay').hidden=false;$('#dialog').querySelector('input,button')?.focus()}
function closeModal(){$('#overlay').hidden=true;lastFocus?.focus()}
function guard(fn){if(!dirty){fn();return}modal('Änderungen behalten?',`<p>Der Markdown-Demoentwurf wurde geändert. Vor dem Wechsel speichern oder verwerfen.</p><footer><button data-decision="cancel">Abbrechen</button><button data-decision="discard">Verwerfen</button><button class="primary" data-decision="save">Speichern & wechseln</button></footer>`);$('#dialog').querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>{closeModal();if(b.dataset.decision==='cancel')return;if(b.dataset.decision==='save')saved=draft;else draft=saved;dirty=false;fn()})}
function openFile(id,permanent=false){guard(()=>{if(preview&&preview!==id){tabs=tabs.filter(t=>t!==preview);preview=null}if(!tabs.includes(id)){tabs.push(id);preview=permanent?null:id}else if(permanent&&preview===id)preview=null;active=id;if(variant==='c'){variant='a';$('#app').classList.remove('focus')}render()})}
function search(){modal('Datei wechseln','<input aria-label="Dateiname suchen" placeholder="Dateinamen eingeben …"><div class="results"></div><footer><button data-action="dismiss">Schließen</button></footer>');const input=$('#dialog input');function results(){$('.results').innerHTML=Object.entries(files).filter(([id,f])=>f.name.toLowerCase().includes(input.value.toLowerCase())).map(([id,f])=>`<button data-result="${id}">${f.icon} &nbsp; ${f.name}</button>`).join('');$('.results').querySelectorAll('button').forEach(b=>b.onclick=()=>{closeModal();openFile(b.dataset.result,true)})}input.oninput=results;input.onkeydown=e=>{if(e.key==='Enter')$('.results button')?.click()};results()}
document.addEventListener('click',e=>{const b=e.target.closest('button,a[data-link]');if(!b)return;
 if(b.dataset.variant){guard(()=>{variant=b.dataset.variant;$('#app').classList.toggle('focus',variant==='b');if(variant==='c'){active='md';for(const id of ['md','pdf'])if(!tabs.includes(id))tabs.push(id);preview=null}render()});return}
 if(b.dataset.file){openFile(b.dataset.file);return}if(b.dataset.link){e.preventDefault();openFile(b.dataset.link,true);return}
 if(b.dataset.tabSelect){guard(()=>{active=b.dataset.tabSelect;if(variant==='c')variant='a';render()});return}
 if(b.dataset.close){guard(()=>{const id=b.dataset.close;tabs=tabs.filter(t=>t!==id);if(preview===id)preview=null;if(!tabs.length){tabs=['md'];notify('Letzte Datei: Für diesen Entwurf bleibt eine Beispieldatei geöffnet.')}if(!tabs.includes(active))active=tabs.at(-1);if(variant==='c')variant='a';render()});return}
 if(b.id==='project-toggle'){const hidden=!$('#project-files').hidden;$('#project-files').hidden=hidden;b.setAttribute('aria-expanded',!hidden);b.textContent=(hidden?'›':'⌄')+' ◇   Garten neu gestalten';return}
 switch(b.dataset.action){case'nav':if(innerWidth<=720)$('#app').classList.toggle('mobile-explorer');else $('#app').classList.toggle('focus');break;case'search':search();break;case'width':readable=!readable;render();break;case'edit':editing=!editing;render();break;case'save':saved=draft;dirty=false;render();notify('Demoentwurf für diese Sitzung gespeichert.');break;case'info':modal('Dateiinformationen',`<p><strong>${files[active].name}</strong></p><p>Ablage: Projekte / Garten neu gestalten<br>Lokales Beispiel · keine Nutzerdatei</p><footer><button data-action="dismiss">Schließen</button></footer>`);break;case'history':modal('Textversionen',`<p>Hier bleibt der kleine Zugang zum Textverlauf. Die Designstudie enthält keine historischen Textstände.</p><footer><button data-action="dismiss">Schließen</button></footer>`);break;case'more':modal('Dateiaktionen','<p>Platz für Umbenennen, Verschieben und In Papierkorb.</p><p>Diese Aktionen sind im Entwurf nur dargestellt.</p><footer><button data-action="dismiss">Schließen</button></footer>');break;case'dismiss':closeModal();break;case'fit':notify('Die Vorschau nutzt bereits die verfügbare Fläche.');break;case'external':notify('Beispieldokument: Im Entwurf wird keine externe App gestartet.');break;case'new':notify('Beispieldaten: Über Datei wechseln kannst du vier Formate ausprobieren.');break;case'sample-nav':notify('Diese Studie konzentriert sich auf geöffnete Dateien. Links kannst du die vier Beispiele wechseln.');break}
});
document.addEventListener('dblclick',e=>{const tab=e.target.closest('[data-tab]');if(tab){preview=null;render()}const file=e.target.closest('[data-file]');if(file)openFile(file.dataset.file,true)});
document.addEventListener('keydown',e=>{if(!$('#overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const items=[...$('#dialog').querySelectorAll('button,input')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='o'){e.preventDefault();search()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(editing){saved=draft;dirty=false;render();notify('Demoentwurf für diese Sitzung gespeichert.')}}if(e.target.matches('[role="tab"]')&&['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const index=tabs.indexOf(active);guard(()=>{active=tabs[(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length];render();$('[data-tab-select="'+active+'"]').focus()})}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
const query=new URLSearchParams(location.search);if(['a','b','c'].includes(query.get('variant')))variant=query.get('variant');if(files[query.get('file')]){active=query.get('file');if(!tabs.includes(active))tabs.push(active)}$('#app').classList.toggle('focus',variant==='b');render();
</script>
</html>
