<div id="para-md-mock" aria-label="P.A.R.A. kompakter Markdown-Editor Entwurf">

          <div class="pm-anchor"><button id="pm-table" aria-expanded="false"><i data-lucide="table-2"></i><span class="pm-table-label">Tabelle</span></button><div id="pm-picker" class="pm-pop pm-picker" hidden><div id="pm-grid-label" aria-live="polite">3 Spalten × 3 Zeilen</div><div id="pm-grid" class="pm-grid" role="group" aria-label="Tabellengröße wählen"></div><div class="pm-muted pm-small">Erste Zeile = Kopfzeile</div></div></div>
          <button id="pm-save" disabled aria-label="Speichern" data-tooltip="Speichern · Cmd/Strg+S"><i data-lucide="save"></i></button>
        </div>
      </header>
      <div id="pm-document" class="pm-document" aria-label="Notiztext"></div>
    </main>
  </div>
</div>
<style>

d-mock .pm-segment{display:flex;gap:1px}#para-md-mock .pm-segment button{font-size:12px;padding:3px 8px;min-height:28px}#para-md-mock .pm-segment button[aria-pressed=true]{background:var(--pm-selected);font-weight:500}#para-md-mock .pm-anchor{position:relative}#para-md-mock .pm-pop{position:absolute;top:calc(100% + 8px);right:0;background:var(--pm-paper);border:1px solid var(--pm-line);border-radius:7px;padding:12px;box-shadow:0 6px 24px #0002;z-index:8}#para-md-mock .pm-format-pop{width:258px}#para-md-mock .pm-format-buttons{display:flex;gap:2px;flex-wrap:wrap}#para-md-mock #pm-help-text{padding:12px 4px 0;font-size:12px;color:var(--pm-soft)}#para-md-mock .pm-picker{width:228px}#para-md-mock .pm-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:10px 0}#para-md-mock .pm-grid button{border:1px solid var(--pm-line);border-radius:2px;aspect-ratio:1;min-height:0;padding:0}#para-md-mock .pm-grid button.pm-lit{background:var(--pm-selected);border-color:var(--pm-accent)}#para-md-mock .pm-document{padding:24px 28px 34px;max-width:816px;margin:auto;overflow-wrap:anywhere;min-height:590px}#para-md-mock .pm-block{margin:0 0 17px;min-height:24px;position:relative}#para-md-mock h1{font-size:25px;line-height:1.3;font-weight:500;letter-spacing:-.5px;margin:0 0 8px}#para-md-mock h2{font-size:15px;font-weight:500;margin:21px 0 8px}#para-md-mock p{margin:0}#para-md-mock strong{font-weight:500}#para-md-mock .pm-block label{display:flex;align-items:flex-start;gap:8px;margin:6px 0}#para-md-mock input[type=checkbox]{accent-color:var(--pm-accent);margin:4px 0;width:14px;height:14px;flex:none}#para-md-mock label:has(:checked)>span{color:var(--pm-soft);text-decoration:line-through}#para-md-mock textarea{width:100%;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--pm-ink);background:transparent;border:0;border-left:2px solid var(--pm-accent);border-radius:0;padding:0 8px;display:block;min-height:44px;tab-size:2}#para-md-mock textarea:focus{outline:0;box-shadow:-1px 0 0 var(--pm-accent)}#para-md-mock .pm-raw{min-height:500px}#para-md-mock table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}#para-md-mock th,#para-md-mock td{border:1px solid var(--pm-line);padding:8px 9px;text-align:left;overflow-wrap:anywhere;position:relative;height:36px}#para-md-mock th{font-weight:500;background:var(--pm-side)}#para-md-mock .pm-cell-selected{box-shadow:inset 0 0 0 2px var(--pm-accent)}#para-md-mock .pm-cell-input{width:100%;min-width:0;font:inherit;color:var(--pm-ink);background:transparent;border:0;padding:0;outline:0}#para-md-mock .pm-table-tools{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:11px;margin:0 0 5px;background:var(--pm-paper)}#para-md-mock .pm-table-tools>span{margin-right:auto;color:var(--pm-soft)}#para-md-mock .pm-table-tools button{min-height:25px;padding:2px 6px}#para-md-mock code{font-family:ui-monospace,monospace}#para-md-mock .pm-link-look{color:var(--pm-accent)}
@media(max-width:850px){#para-md-mock .pm-layout{grid-template-columns:42px minmax(0,1fr)}#para-md-mock .pm-explorer{display:none}}
@media(max-width:460px){#para-md-mock .pm-layout{display:block}#para-md-mock .pm-rail{display:none}#para-md-mock .pm-header{padding:8px;gap:5px}#para-md-mock .pm-tab{width:100%}#para-md-mock .pm-actions{margin-left:0;width:100%;justify-content:space-between;gap:0}#para-md-mock .pm-table-label{display:none}#para-md-mock .pm-document{padding:19px 13px 25px}#para-md-mock .pm-picker{right:-34px}#para-md-mock .pm-format-pop{right:-72px}#para-md-mock .pm-table-tools>span{width:100%}#para-md-mock th,#para-md-mock td{padding:6px}}
@media(pointer:coarse){#para-md-mock button{min-height:44px}#para-md-mock textarea,#para-md-mock .pm-cell-input{font-size:16px}#para-md-mock .pm-grid{gap:2px}#para-md-mock .pm-grid button{min-height:24px}#para-md-mock .pm-table-tools button{min-height:44px}}
</style>
<script>
(()=>{
const root=document.getElementById('para-md-mock'),$=s=>root.querySelector(s),$$=s=>Array.from(root.querySelectorAll(s));
let mode='live',blocks=['# Besprechung zur neuen Website','Die Startseite soll **klarer und ruhiger** werden. Wir konzentrieren uns auf die wichtigsten Inhalte.','## Nächste Schritte','- [x] Bestehende Inhalte sichten\n- [ ] Entwurf für die Startseite erstellen\n- [ ] Rückmeldung im Team einholen','## Seitenplanung','| Seite | Inhalt | Stand |\n| --- | --- | --- |\n| Startseite | Angebot auf einen Blick | In Arbeit |\n| Kontakt | Ansprechperson & E-Mail | Offen |','Die Texte sammeln wir zuerst hier. Danach stimmen wir die Reihenfolge gemeinsam ab.'],active=1,cell=null,lastFocus=null,history=[],future=[],saved=blocks.join('\n\n'),gridCols=3,gridRows=3;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<span class="pm-link-look">$1</span>');
const isTable=s=>/^\|/.test(s);
function matrix(s){return s.trim().split('\n').filter(l=>!/^\|(?:\s*:?-{3,}:?\s*\|)+\s*$/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|')));}
function serialize(m){const row=r=>'| '+r.map(s=>s.replace(/\|/g,'\\|').replace(/\n/g,' ')).join(' | ')+' |';return [row(m[0]),row(m[0].map(()=>'---')),...m.slice(1).map(row)].join('\n');}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function grow(t){t.style.overflow='hidden';t.style.resize='none';t.style.height='auto';t.style.height=(t.scrollHeight+2)+'px';}
function remember(){history.push(blocks.join('\n\n'));if(history.length>60)history.shift();future=[];}
function status(){const dirty=blocks.join('\n\n')!==saved;$('#pm-dirty').hidden=!dirty;$('#pm-save').disabled=!dirty;$('#pm-save').setAttribute('aria-label',dirty?'Änderungen speichern':'Gespeichert');$('#pm-undo').disabled=!history.length;$('#pm-redo').disabled=!future.length;}
function persist(){window.openai?.setWidgetState?.({modelContent:{editorMock:{version:2,mode}},privateContent:{version:2,mode}}).catch(()=>{});}
function closePops(){$('#pm-picker').hidden=true;$('#pm-format-pop').hidden=true;$('#pm-table').setAttribute('aria-expanded','false');$('#pm-format').setAttribute('aria-expanded','false');}
function blockHTML(s,i){if(/^#{1,3} /.test(s)){const n=s.match(/^#+/)[0].length;return '<h'+n+'>'+inline(s.replace(/^#+ /,''))+'</h'+n+'>';}
if(/^- \[[ xX]\]/.test(s))return s.split('\n').map((l,j)=>{const m=l.match(/^- \[([ xX])\] (.*)$/);return m?'<label><input type="checkbox" data-block="'+i+'" data-line="'+j+'" '+(m[1]!==' '?'checked':'')+' aria-label="'+esc(m[2])+'"><span>'+inline(m[2])+'</span></label>':'<p>'+inline(l)+'</p>';}).join('');
if(/^- /.test(s))return '<ul>'+s.split('\n').map(l=>'<li>'+inline(l.replace(/^- /,''))+'</li>').join('')+'</ul>';return '<p>'+inline(s).replace(/\n/g,'<br>')+'</p>';}
function tableHTML(s,i){const m=matrix(s),selected=mode==='live'&&cell?.block===i;let html=selected?'<div class="pm-table-tools" aria-label="Tabellenaktionen"><span>Zeile '+(cell.r+1)+' · Spalte '+(cell.c+1)+'</span><button data-op="row-add">Zeile +</button><button data-op="row-del" '+(cell.r===0||m.length<=1?'disabled':'')+'>Zeile −</button><button data-op="col-add">Spalte +</button><button data-op="col-del" '+(m[0].length<=1?'disabled':'')+'>Spalte −</button><button data-op="done" aria-label="Tabellenbearbeitung schließen">Fertig</button></div>':'';
html+='<table aria-label="Seitenplanung">'+m.map((row,r)=>'<tr>'+row.map((v,c)=>{const tag=r?'td':'th',sel=selected&&cell.r===r&&cell.c===c;return '<'+tag+' data-r="'+r+'" data-c="'+c+'"'+(sel?' class="pm-cell-selected"':'')+'>'+(sel?'<input class="pm-cell-input" aria-label="Zeile '+(r+1)+', Spalte '+(c+1)+'" value="'+esc(v)+'">':inline(v)||'&nbsp;')+'</'+tag+'>';}).join('')+'</tr>').join('')+'</table>';return html;}
function render(){
$$('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('#pm-format').hidden=mode==='read';$('#pm-table').hidden=mode==='read';const doc=$('#pm-document');doc.replaceChildren();
if(mode==='raw'){const t=document.createElement('textarea');t.className='pm-raw';t.setAttribute('aria-label','Markdown-Quelltext');t.value=blocks.join('\n\n');t.onfocus=()=>lastFocus=t;t.oninput=()=>{remember();blocks=t.value.split('\n\n');grow(t);status();};doc.append(t);grow(t);}
else blocks.forEach((s,i)=>{const div=document.createElement('div');div.className='pm-block';div.dataset.index=i;
if(isTable(s)){div.innerHTML=tableHTML(s,i);if(mode==='live'){
div.querySelectorAll('td,th').forEach(td=>td.onclick=e=>{if(e.target.matches('input'))return;active=-1;cell={block:i,r:Number(td.dataset.r),c:Number(td.dataset.c)};render();const input=$('.pm-cell-input');input?.focus();input?.select();});
const input=div.querySelector('.pm-cell-input');if(input){input.oninput=()=>{remember();const m=matrix(blocks[i]);m[cell.r][cell.c]=input.value;blocks[i]=serialize(m);status();};input.onkeydown=e=>{if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();const m=matrix(blocks[i]),last=m[0].length-1;if(e.shiftKey){if(cell.c>0)cell.c--;else if(cell.r>0){cell.r--;cell.c=last;}}else if(cell.c<last)cell.c++;else if(cell.r<m.length-1){cell.r++;cell.c=0;}render();const next=$('.pm-cell-input');next?.focus();next?.select();}if(e.key==='Escape'){cell=null;render();}};}
div.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{const op=b.dataset.op;if(op==='done'){cell=null;render();return;}remember();const m=matrix(blocks[i]);if(op==='row-add'){const at=cell.r+1;m.splice(at,0,Array(m[0].length).fill(''));cell.r=at;}if(op==='row-del'){m.splice(cell.r,1);cell.r=Math.min(cell.r,m.length-1);}if(op==='col-add'){const at=cell.c+1;m.forEach(r=>r.splice(at,0,''));cell.c=at;}if(op==='col-del'){m.forEach(r=>r.splice(cell.c,1));cell.c=Math.min(cell.c,m[0].length-1);}blocks[i]=serialize(m);render();$('.pm-cell-input')?.focus();});}
doc.append(div);return;}
if(mode==='live'&&active===i){const t=document.createElement('textarea');t.value=s;t.rows=2;t.setAttribute('aria-label','Aktiven Markdown-Block bearbeiten');t.onfocus=()=>lastFocus=t;t.oninput=()=>{remember();blocks[i]=t.value;grow(t);status();};t.onkeydown=e=>{if(e.key==='Escape'){active=-1;render();}};div.append(t);doc.append(div);grow(t);}
else{div.innerHTML=blockHTML(s,i);if(mode==='live')div.onclick=e=>{if(e.target.closest('input'))return;closePops();cell=null;active=i;render();const t=$('#pm-document textarea');t?.focus();t?.setSelectionRange(t.value.length,t.value.length);};doc.append(div);}
});
$$('#pm-document input[type=checkbox]').forEach(c=>c.onchange=()=>{remember();const i=Number(c.dataset.block),j=Number(c.dataset.line),lines=blocks[i].split('\n');lines[j]=lines[j].replace(/^- \[[ xX]\]/,c.checked?'- [x]':'- [ ]');blocks[i]=lines.join('\n');status();});status();icons();}
$$('[data-mode]').forEach(b=>b.onclick=()=>{closePops();mode=b.dataset.mode;active=mode==='live'?1:-1;cell=null;render();persist();});
$('#pm-save').onclick=()=>{saved=blocks.join('\n\n');status();};
$('#pm-format').onclick=()=>{const show=$('#pm-format-pop').hidden;closePops();$('#pm-format-pop').hidden=!show;$('#pm-format').setAttribute('aria-expanded',String(show));};
$('#pm-format-pop').onmousedown=e=>{if(e.target.closest('button'))e.preventDefault();};
$('#pm-undo').onclick=()=>{if(history.length){future.push(blocks.join('\n\n'));blocks=history.pop().split('\n\n');active=Math.min(active,blocks.length-1);cell=null;render();}};
$('#pm-redo').onclick=()=>{if(future.length){history.push(blocks.join('\n\n'));blocks=future.pop().split('\n\n');cell=null;render();}};
$$('[data-format]').forEach(b=>b.onclick=()=>{let t=lastFocus;if(!t?.isConnected){active=blocks.length-1;cell=null;render();t=$('#pm-document textarea');}if(!t)return;const a=t.selectionStart,z=t.selectionEnd,v=t.value.slice(a,z)||'Text',map={heading:'## '+v,bold:'**'+v+'**',italic:'*'+v+'*',list:'- '+v,check:'- [ ] '+v,link:'['+v+'](https://beispiel.de)',code:'`'+v+'`'};remember();const insert=map[b.dataset.format];t.value=t.value.slice(0,a)+insert+t.value.slice(z);if(mode==='raw')blocks=t.value.split('\n\n');else blocks[active]=t.value;grow(t);status();t.focus();t.setSelectionRange(a,a+insert.length);});
$('#pm-help').onclick=()=>{$('#pm-help-text').hidden=!$('#pm-help-text').hidden;};
function highlight(cols,rows){gridCols=cols;gridRows=rows;$('#pm-grid-label').textContent=cols+' Spalten × '+rows+' Zeilen';$$('#pm-grid button').forEach(b=>{const on=Number(b.dataset.c)<=cols&&Number(b.dataset.r)<=rows;b.classList.toggle('pm-lit',on);});}
for(let r=1;r<=6;r++)for(let c=1;c<=8;c++){const b=document.createElement('button');b.dataset.c=c;b.dataset.r=r;b.setAttribute('aria-label',c+' Spalten, '+r+' Zeilen');b.onpointerenter=()=>highlight(c,r);b.onfocus=()=>highlight(c,r);b.onclick=()=>{const m=Array.from({length:r},(_,ri)=>Array.from({length:c},(_,ci)=>ri===0?'Spalte '+(ci+1):'')),table=serialize(m);remember();let index;if(mode==='raw'){const t=$('.pm-raw'),a=t.selectionStart,z=t.selectionEnd;t.value=t.value.slice(0,a)+'\n\n'+table+'\n\n'+t.value.slice(z);blocks=t.value.split('\n\n');}else{index=cell?cell.block+1:active>=0?active+1:blocks.length;blocks.splice(index,0,table);active=-1;cell={block:index,r:0,c:0};}closePops();render();$('.pm-cell-input')?.focus();$('.pm-cell-input')?.select();};$('#pm-grid').append(b);}
$('#pm-table').onclick=()=>{const show=$('#pm-picker').hidden;closePops();$('#pm-picker').hidden=!show;$('#pm-table').setAttribute('aria-expanded',String(show));highlight(gridCols,gridRows);};
root.addEventListener('click',e=>{if(!e.target.closest('.pm-anchor'))closePops();});
root.addEventListener('keydown',e=>{if(e.key==='Escape'){closePops();cell=null;active=-1;render();}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saved=blocks.join('\n\n');status();}});
function restore(state){const s=state?.privateContent;if(s?.version===2&&['live','raw','read'].includes(s.mode))mode=s.mode;render();}restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
let previousWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width===previousWidth)return;previousWidth=width;$$('#pm-document textarea').forEach(grow);}).observe($('#pm-document'));
})();
</script>
